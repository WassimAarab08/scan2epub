name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.4"
  PYTHON_VERSION: "3.12"
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install the project
        run: uv sync --extra api --extra eval --locked

      - name: Check the formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Check the types
        run: uv run pyright

      - name: Check the licences of the dependencies
        run: uv run python scripts/check_licenses.py

      - name: Run the tests
        run: uv run pytest --cov=src/scan2epub --cov-report=xml --cov-report=term

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  epub:
    name: EPUB validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install the project
        run: uv sync --extra api --locked

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-spa tesseract-ocr-spa-old tesseract-ocr-eng
          tesseract --list-langs

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download EPUBCheck
        run: |
          curl -sSL -o epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          echo "SCAN2EPUB_EPUBCHECK_JAR=$PWD/epubcheck-5.4.0/epubcheck.jar" >> "$GITHUB_ENV"

      - name: Generate a book and validate it
        run: |
          uv run python scripts/make_sample_book.py --output sample.epub
          java -jar "$SCAN2EPUB_EPUBCHECK_JAR" sample.epub

      - name: Upload the generated book
        uses: actions/upload-artifact@v4
        with:
          name: sample-epub
          path: sample.epub
          retention-days: 7

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install the project
        run: uv sync --extra api --extra eval --locked

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng
          tesseract --list-langs

      - name: Install the browser
        run: uv run playwright install --with-deps chromium

      - name: Fetch the reader used by the tests
        run: uv run python scripts/fetch_browser_assets.py

      - name: Run the browser tests
        run: uv run pytest tests/browser -v

  docker:
    name: Build the images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gpu
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:gpu
          cache-from: type=gha
          cache-to: type=gha,mode=max
