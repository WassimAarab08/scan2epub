name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday, at 04:17 UTC.
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse the Python code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdfium2 opencv-python-headless numpy pillow pytesseract pydantic typer rich structlog

      - name: Run CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Perform the analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
